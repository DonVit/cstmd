# PHP2Shell (CVE-2026-109618 / CVE-2026-109619) interim mitigations.
# Applied to all vhosts via an Include in httpd.conf (see Dockerfile/entrypoint.sh).
# These reduce exposure on the unpatched PHP 5.6 runtime; they are NOT a fix.
# Remove/review this file after the PHP 8.4 migration (Phase 5/6).

# --- CVE-2026-109619: disable session upload-progress request parsing ---
# This is a PHP_INI_SYSTEM/PHP_INI_PERDIR style hardening applied per-directory.
<IfModule mod_php5.c>
    php_value session.upload_progress.enabled 0
    # Conservative request-size limits (CVE-2026-109618 surface reduction).
    # NOTE: do NOT set memory_limit=-1 here; it raises resource-exhaustion risk.
    php_value post_max_size 8M
    php_value upload_max_filesize 4M
    php_value max_input_nesting_level 32
    php_value max_input_vars 1000
</IfModule>

# --- Restrict access to admin-ish / low-value sections until patched ---
# Covers both local Docker (/var/www/...) and prod (/var/www/cstmdlive/cstmd/...).
<DirectoryMatch "^/var/www/(cstmdlive/cstmd/)?(tools|labs|stats)">
    Require ip 127.0.0.1 ::1
    ErrorDocument 403 /error.php
</DirectoryMatch>
